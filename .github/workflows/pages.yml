name: Check and deploy game
on:
  pull_request:
  push:
    branches: [main]
    # Docs never reach the bundle, so a docs-only push skips the pipeline.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run the exhaustive browser and card workshop suites
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
env:
  # Pages serves a project site at /<repository name>/, so the base follows
  # the repository name and survives a rename.
  BASE_PATH: /${{ github.event.repository.name }}/
  VITE_RELEASE_ID: ${{ github.sha }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      # The browser jobs test this exact build, and deploy publishes it.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
  browser:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      # Two WebKit pages rendering at once on one runner can stall its
      # painting (a tap then waits forever for a stable element), so each
      # WebKit shard runs one test at a time, and WebKit is split across
      # three shards to finish alongside the Chromium job.
      matrix:
        include:
          - { project: chromium, shard: 1, shards: 1, workers: 2 }
          - { project: webkit, shard: 1, shards: 3, workers: 1 }
          - { project: webkit, shard: 2, shards: 3, workers: 1 }
          - { project: webkit, shard: 3, shards: 3, workers: 1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Browser binaries are cached per Playwright version; their system
      # libraries are not cacheable, so those install on every run.
      - id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-${{ matrix.project }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.project }}
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.project }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npm run test:release -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }} --workers=${{ matrix.workers }}
      # Two fresh builds on one origin, driven in Chromium.
      - run: npm run test:update
        if: matrix.project == 'chromium'
      - run: npm run test:e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }} --workers=${{ matrix.workers }}
        if: github.event_name == 'workflow_dispatch' && inputs.full_validation
      - run: npm run test:workshop -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }} --workers=${{ matrix.workers }}
        if: github.event_name == 'workflow_dispatch' && inputs.full_validation
        env:
          BASE_PATH: /
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
  # The crawl and League balance simulations (4,000 seeded runs each) take
  # about two minutes, so they run beside the build and browser jobs instead
  # of inside `npm test`; a deploy still waits for them.
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:balance
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, browser, balance]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
