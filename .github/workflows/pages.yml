name: Check and deploy game
on:
  pull_request:
  push:
    branches: [main]
    # Docs never reach the bundle, so a docs-only push skips the pipeline.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run the exhaustive browser and card workshop suites
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
env:
  # Pages serves a project site at /<repository name>/, so the base follows
  # the repository name and survives a rename.
  BASE_PATH: /${{ github.event.repository.name }}/
  VITE_RELEASE_ID: ${{ github.sha }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      # The browser jobs test this exact build, and deploy publishes it.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  browser:
    needs: build
    runs-on: ubuntu-latest
    # Browsers and their system libraries come preinstalled. The tag must
    # match the @playwright/test version in package-lock.json; a mismatch
    # fails loudly with a missing-executable error.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    strategy:
      fail-fast: true
      matrix:
        project: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npm run test:release -- --project=${{ matrix.project }}
      # Two fresh builds on one origin, driven in Chromium.
      - run: npm run test:update
        if: matrix.project == 'chromium'
      - run: npm run test:e2e -- --project=${{ matrix.project }}
        if: github.event_name == 'workflow_dispatch' && inputs.full_validation
      - run: npm run test:workshop -- --project=${{ matrix.project }}
        if: github.event_name == 'workflow_dispatch' && inputs.full_validation
        env:
          BASE_PATH: /
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures-${{ matrix.project }}
          path: test-results/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, browser]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
