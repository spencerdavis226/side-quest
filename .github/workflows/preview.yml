name: Check preview
# A push to `preview` is checked here (unit tests, lint, the preview build
# and the balance simulations), then the main workflow is dispatched on
# main: Pages deploys only from main, and that run publishes the live game
# at <base> and this branch at <base>next/. The browser suites run on main.
on:
  push:
    branches: [preview]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
permissions:
  contents: read
concurrency:
  group: preview
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/next/
          VITE_CHANNEL: preview
  # One job per balance file, so the two simulations run at once.
  balance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite: [dungeon, league]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npx vitest run tests/${{ matrix.suite }}.balance.test.ts
  publish:
    needs: [check, balance]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --ref main --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
