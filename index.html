<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#271c11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- No apple-mobile-web-app-status-bar-style (2026-10-17): with
         black-translucent the page runs under the status bar and iOS 26+
         blurs its top ~40pt, header included; no CSS removes that. Without
         it the installed app starts below an opaque status bar tinted by
         theme-color. iOS reads this only when the app is added to the Home
         Screen, so an existing install must be removed and re-added. -->
    <meta name="apple-mobile-web-app-title" content="Side Quest" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link
      rel="preload"
      href="%BASE_URL%fonts/source-serif-4-bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%BASE_URL%fonts/grenze.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%BASE_URL%fonts/grenze-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%BASE_URL%art/table.webp"
      as="image"
      type="image/webp"
    />
    <link
      rel="preload"
      href="%BASE_URL%art/button.webp"
      as="image"
      type="image/webp"
    />
    <title>Side Quest</title>
    <script>
      // Installed Home Screen app: flag it before first paint so the page is
      // laid out at the full screen height from the first frame (style.css).
      if (
        navigator.standalone === true ||
        matchMedia("(display-mode: standalone)").matches
      )
        document.documentElement.classList.add("standalone");
    </script>
  </head>
  <body>
    <!-- The installed app's status-bar edge; see .status-edge in style.css. -->
    <div class="status-edge" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
